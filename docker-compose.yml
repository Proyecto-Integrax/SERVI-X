services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: servix
      POSTGRES_PASSWORD: servix
      POSTGRES_DB: servix
    ports:
      - "5432:5432"
    volumes:
      - servix_db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://servix:servix@db:5432/servix?schema=public
      JWT_SECRET: cambia-este-secreto-en-produccion
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  servix_db_data:
